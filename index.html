<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .video-container {
            text-align: center;
            background-color: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            width: 100%;
        }
        video {
            width: 100%;
            max-width: 750px;
            height: auto;
            border-radius: 8px;
            background-color: #000;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <h1>Watch This Video!</h1>
        <video controls preload="auto" muted autoplay>
            <source src="videos/VID12.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
</body>
</html>
